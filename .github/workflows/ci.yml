name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: givetoafrica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/givetoafrica_test
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/givetoafrica_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:hostpinnacle
        env:
          GOOGLE_INDEXING_API_CLIENT_EMAIL: ${{ secrets.GOOGLE_INDEXING_API_CLIENT_EMAIL }}
          GOOGLE_INDEXING_API_PRIVATE_KEY: ${{ secrets.GOOGLE_INDEXING_API_PRIVATE_KEY }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            prisma/schema.prisma
            package.json
            package-lock.json

  deploy-production:
    name: Deploy to Production (cPanel)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://givetoafrica.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./deploy
      - name: Deploy to cPanel
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'
            set -e
            BACKEND="/home2/datingsi/backend"
            WEBDIR="/home2/datingsi/givetoafrica.net"
            # Clean target directories
            rm -rf "$BACKEND"/*
            # Copy pre-built server output to backend
            cp -R ./deploy/dist/server/* "$BACKEND/"
            # Copy prisma schema + package files
            cp -R ./deploy/prisma "$BACKEND/"
            cp ./deploy/package.json "$BACKEND/"
            cp ./deploy/package-lock.json "$BACKEND/"
            # Install production deps only (no devDeps, no build tools needed)
            export NODE="/home2/datingsi/nodevenv/backend/18/bin/node"
            export NPM="/home2/datingsi/nodevenv/backend/18/bin/npm"
            cd "$BACKEND"
            $NPM ci --omit=dev
            # Write Google Indexing API credentials to .env
            cat >> .env <<ENVEOF
GOOGLE_INDEXING_API_CLIENT_EMAIL=${{ secrets.GOOGLE_INDEXING_API_CLIENT_EMAIL }}
GOOGLE_INDEXING_API_PRIVATE_KEY=${{ secrets.GOOGLE_INDEXING_API_PRIVATE_KEY }}
ENVEOF
            # Run Prisma migrations
            $NPM exec prisma generate
            $NPM exec prisma migrate deploy
            # Restart via Passenger
            mkdir -p "$BACKEND/tmp"
            touch "$BACKEND/tmp/restart.txt"
          EOF
