---
deployment:
  tasks:
    - export DEPLOYPATH=/home/datingsi/public_html/
    - npm install
    - npx prisma generate
    - npm run build
    - npx tsc -p tsconfig.server.json
    - /bin/cp -R dist/* $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp server.js $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp -R node_modules $DEPLOYPATH
    - /bin/cp -R prisma $DEPLOYPATH
