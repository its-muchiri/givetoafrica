---
deployment:
  tasks:
    - export FRONTPATH=/home2/datingsi/public_html/
    - export BACKENDPATH=/home2/datingsi/backend/
    - cp -R dist/assets $FRONTPATH
    - cp -R dist/img $FRONTPATH
    - cp -R dist/blogs $FRONTPATH
    - cp dist/index.html $FRONTPATH
    - cp dist/favicon.ico $FRONTPATH
    - cp dist/favicon.svg $FRONTPATH
    - cp dist/logo-full.svg $FRONTPATH
    - cp .htaccess $FRONTPATH
    - cp -R dist/server $BACKENDPATH
    - cp -R prisma $BACKENDPATH
    - cp package.json $BACKENDPATH
